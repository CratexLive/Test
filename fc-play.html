<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CricxCrate — Player</title>
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<style>
html,body{margin:0;padding:0;background:#000;height:100%;width:100%;overflow:hidden;font-family:sans-serif;}
.video-container{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;}
video{width:100%;height:100%;object-fit:contain;background:#000;}
:root{--plyr-color-main:#d8ff3e;}
.loading-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;color:#fff;z-index:2000;font-size:14px;}
.spinner{border:3px solid rgba(255,255,255,.2);border-top:3px solid #d8ff3e;border-radius:50%;width:36px;height:36px;animation:spin 1s linear infinite;margin-bottom:12px;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
</head>
<body>
<div class="video-container">
  <video id="video" controls crossorigin playsinline></video>
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    Loading stream...
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const encoded = params.get("data");
let rawUrl = encoded ? atob(encoded) : "";
const proxyUrl = 'proxy.js?u=' + encodeURIComponent(rawUrl);

const video = document.getElementById("video");
const loading = document.getElementById("loading");
let playerInstance = null;
let hlsInstance = null;

function initPlayer() {
  if(!rawUrl){ alert("Stream URL missing"); return; }

  if (Hls.isSupported()) {
    const hls = new Hls({ maxBufferLength: 30, enableWorker: true });
    hls.loadSource(proxyUrl);
    hls.attachMedia(video);
    hlsInstance = hls;

    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
      const availableQualities = hls.levels.map((l) => l.height);
      
      if (!playerInstance) {
        playerInstance = new Plyr(video, {
          autoplay: true,
          controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
          settings: ['quality', 'speed'],
          quality: {
            default: availableQualities[0],
            options: availableQualities,
            forced: true,
            onChange: (newQuality) => {
              hls.levels.forEach((level, index) => {
                if (level.height === newQuality) {
                  hls.currentLevel = index;
                }
              });
            }
          },
          speed: { selected: 1, options: [0.5, 1, 1.25, 1.5] },
          fullscreen: { enabled: true, fallback: true, iosNative: true }
        });
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = proxyUrl;
    playerInstance = new Plyr(video, { autoplay: true });
  }

  video.play().catch(() => { video.muted = true; video.play(); });
  video.addEventListener("playing", () => { loading.style.display = "none"; });
}

document.addEventListener("DOMContentLoaded", initPlayer);
</script>
</body>
</html>
