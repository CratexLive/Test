<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>CRICXCRATE LIVE</title>

<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind (for the popup styling) -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<!-- SHAKA PLAYER -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<style>

html,body{
margin:0;
padding:0;
background:#000;
height:100%;
width:100%;
overflow:hidden;
font-family:'Poppins',sans-serif;
}

.video-container{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
}

.shaka-video-container{
width:100%;
height:100%;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

.loading-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:#000;
color:#fff;
z-index:2000;
font-size:18px;
}

.spinner{
border:4px solid rgba(255,255,255,.2);
border-top:4px solid #3b82f6;
border-radius:50%;
width:40px;
height:40px;
animation:spin 1s linear infinite;
margin-bottom:12px;
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

/* Telegram Modal Modern Floating & 1s Fade Animations */
#telegramModal {
  position: fixed;
  inset: 0;
  background: rgba(5, 8, 20, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1s ease, visibility 1s ease;
}

#telegramModal.active {
  opacity: 1;
  visibility: visible;
}

#telegramModal .modal-content {
  width: 90%;
  max-width: 380px;
  background: linear-gradient(145deg, #131d2f, #0d1522);
  border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 28px;
  padding: 30px 24px;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(37, 99, 235, 0.15);
  transform: translateY(20px) scale(0.95);
  transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
}

#telegramModal.active .modal-content {
  transform: translateY(0) scale(1);
}

*{
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
-webkit-tap-highlight-color: transparent;
}

</style>

</head>

<body>

<div class="video-container">
  <div class="shaka-video-container" data-shaka-player>
    <video id="video" autoplay playsinline muted></video>
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      Analyzing the video...
    </div>
  </div>
</div>

<!-- TELEGRAM JOIN MODAL -->
<div id="telegramModal">
  <div class="modal-content">
    <div class="relative w-16 h-16 bg-gradient-to-tr from-blue-600 to-blue-400 text-white rounded-2xl flex items-center justify-center mx-auto mb-5 text-3xl shadow-lg shadow-blue-500/30 transform hover:rotate-6 transition">
      <i class="fab fa-telegram-plane"></i>
    </div>
    <h2 class="text-2xl font-bold text-white mb-2">Join Our Telegram</h2>
    <p class="text-gray-400 text-sm mb-7 leading-relaxed">Join our official Telegram channel for instant match links and updates!</p>
    <a href="https://t.me/+_pLB6Lxkr_tkM2I1" target="_blank" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2.5 mb-4 transition transform active:scale-95 shadow-xl shadow-blue-600/30 text-base no-underline">
      <i class="fab fa-telegram text-xl"></i> JOIN NOW
    </a>
    <button onclick="closeTelegramModal()" class="w-full text-gray-400 hover:text-white text-xs font-semibold py-2 tracking-wider uppercase transition bg-transparent border-none cursor-pointer">
      I've joined
    </button>
  </div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const encoded = params.get("data");
let streamUrl = encoded ? atob(encoded) : "";

const video = document.getElementById("video");
const loading = document.getElementById("loading");

document.addEventListener("DOMContentLoaded", () => {
  // Show telegram modal on every opening without localStorage restriction
  setTimeout(() => {
    document.getElementById('telegramModal').classList.add('active');
  }, 200);

  initPlayer();
});

function closeTelegramModal() {
  const modal = document.getElementById('telegramModal');
  modal.classList.remove('active');
  setTimeout(() => {
    modal.style.display = 'none';
  }, 1000);
}

async function initPlayer(){

  if(!streamUrl){
    alert("Stream URL missing");
    return;
  }

  try{

    const player = new shaka.Player(video);
    const container = document.querySelector(".shaka-video-container");
    const ui = new shaka.ui.Overlay(player, container, video);

    ui.configure({
      controlPanelElements:[
        'play_pause',
        'mute',
        'time_and_duration',
        'spacer',
        'quality',
        'language',
        'picture_in_picture',
        'fullscreen',
        'overflow_menu'
      ],
      addSeekBar:true
    });

    player.configure({
      streaming:{
        bufferingGoal:10,
        rebufferingGoal:2,
        bufferBehind:30
      }
    });

    await player.load(streamUrl);

    video.play().catch(()=>{
      video.muted=true;
      video.play();
    });

    video.addEventListener("playing",()=>{
      loading.style.display="none";
    });

  }

  catch(e){

    console.log("Shaka error:",e);

    video.src = streamUrl;
    video.play();

    video.addEventListener("playing",()=>{
      loading.style.display="none";
    });

  }

}

</script>

</body>
</html>
