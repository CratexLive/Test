<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CricxCrate — Player</title>
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
<style>
html,body{margin:0;padding:0;background:#000;height:100%;width:100%;overflow:hidden;font-family:sans-serif;}
.video-container{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;}
.shaka-video-container{width:100%;height:100%;}
video{width:100%;height:100%;object-fit:contain;background:#000;}
.loading-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;color:#fff;z-index:2000;font-size:14px;}
.spinner{border:3px solid rgba(255,255,255,.2);border-top:3px solid #d8ff3e;border-radius:50%;width:36px;height:36px;animation:spin 1s linear infinite;margin-bottom:12px;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
</head>
<body>
<div class="video-container">
  <div class="shaka-video-container" data-shaka-player>
    <video id="video" autoplay playsinline controls></video>
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      Loading secure stream...
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const encoded = params.get("data");
let rawUrl = encoded ? atob(encoded) : "";
const proxyUrl = 'proxy.js?u=' + encodeURIComponent(rawUrl);
const video = document.getElementById("video");
const loading = document.getElementById("loading");

async function initPlayer(){
  if(!rawUrl){ alert("Stream URL missing"); return; }
  
  let isLoaded = false;

  // Fallback timer: agar 6 second me shaka load na ho toh direct proxy url set kar do
  const timer = setTimeout(() => {
    if(!isLoaded) {
      console.warn("Switching to direct fallback player");
      video.src = proxyUrl;
      video.play().catch(()=>{});
      video.addEventListener("playing", () => {
        loading.style.display = "none";
      });
    }
  }, 6000);

  try{
    const player = new shaka.Player(video);
    const container = document.querySelector(".shaka-video-container");
    const ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
      controlPanelElements:['play_pause','mute','time_and_duration','spacer','quality','fullscreen','overflow_menu'],
      addSeekBar:true
    });
    
    await player.load(proxyUrl);
    isLoaded = true;
    clearTimeout(timer);
    
    video.play().catch(()=>{ video.muted=true; video.play(); });
    video.addEventListener("playing",()=>{ loading.style.display="none"; });
  }catch(e){
    console.error("Shaka error:", e);
    if(!isLoaded){
      clearTimeout(timer);
      video.src = proxyUrl;
      video.play().catch(()=>{});
      video.addEventListener("playing",()=>{ loading.style.display="none"; });
    }
  }
}

video.addEventListener("playing", () => { loading.style.display = "none"; });
document.addEventListener("DOMContentLoaded", initPlayer);
</script>
</body>
</html>
